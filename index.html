<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cobus Contact Cards</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-style">
:root{
  --paper:#F2F5FA; --surface:#FFFFFF; --surface-2:#F7F9FD;
  --ink:#0B1729; --ink-2:#5A6B85; --ink-3:#8A99B2;
  --line:#DEE5F0; --line-soft:#EAF0F8;
  --brand:#1E56C8; --brand-deep:#0D2A63; --brand-soft:#E7EEFC;
  --amber:#B0671A; --amber-soft:#FBF0E1;
  --danger:#B22B2B;
  --shadow:0 1px 2px rgba(13,42,99,.06), 0 8px 24px rgba(13,42,99,.07);
  --shadow-lg:0 24px 60px rgba(13,42,99,.18);
  --r-s:8px; --r-m:12px; --r-l:18px;
  --card-1:#3E77DC; --card-2:#1E56C8; --card-3:#0C2A66;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#080F1D; --surface:#101A2E; --surface-2:#16223A;
    --ink:#E9EEF9; --ink-2:#93A3BF; --ink-3:#6C7C99;
    --line:#1E2B44; --line-soft:#182541;
    --brand:#6E9CF6; --brand-deep:#9FC0FF; --brand-soft:#17233E;
    --amber:#E0A55C; --amber-soft:#26200F;
    --danger:#F08585;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#080F1D; --surface:#101A2E; --surface-2:#16223A;
  --ink:#E9EEF9; --ink-2:#93A3BF; --ink-3:#6C7C99;
  --line:#1E2B44; --line-soft:#182541;
  --brand:#6E9CF6; --brand-deep:#9FC0FF; --brand-soft:#17233E;
  --amber:#E0A55C; --amber-soft:#26200F;
  --danger:#F08585;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ---------------- shell ---------------- */
#root{min-height:100vh}
.shell{
  max-width:460px;margin:0 auto;min-height:100vh;
  background:var(--surface);
  box-shadow:0 0 0 1px var(--line-soft);
  display:flex;flex-direction:column;
}
@media (min-width:520px){
  body{background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--brand) 10%, var(--paper)) 0%, var(--paper) 60%);
  }
  .shell{min-height:100vh}
}

/* ---------------- home ---------------- */
.banner{
  position:relative;overflow:hidden;
  background:linear-gradient(155deg,var(--card-1) 0%,var(--card-2) 45%,var(--card-3) 100%);
  color:#fff;padding:26px 22px 22px;
}
.banner .swoosh{position:absolute;inset:0;opacity:.16;pointer-events:none}
.banner-inner{position:relative;display:flex;flex-direction:column;gap:14px}
/* The logo doubles as the editor gate: kill text selection, the iOS
   long-press callout and double-tap zoom so repeated taps register cleanly. */
.brand-gate{
  display:inline-flex;align-self:flex-start;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.wordmark{display:inline-flex;align-items:center;gap:8px;color:#fff}
.wordmark svg{flex:none}
.wordmark span{
  font-family:Archivo,"Segoe UI",sans-serif;font-weight:700;font-size:26px;
  letter-spacing:-.03em;line-height:1;
}
.wordmark img{max-height:34px;max-width:190px;display:block}
.banner h1{
  margin:0;font-family:Archivo,sans-serif;font-weight:700;font-size:21px;
  letter-spacing:-.015em;text-wrap:balance;
}
.banner p{margin:2px 0 0;font-size:13px;color:rgba(255,255,255,.72);max-width:34ch}

.searchbar{padding:14px 16px 6px;position:sticky;top:0;z-index:12;background:var(--surface)}
.searchbox{
  display:flex;align-items:center;gap:9px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:0 14px;height:42px;
}
.searchbox svg{flex:none;color:var(--ink-3)}
.searchbox input{
  border:0;background:none;flex:1;min-width:0;height:100%;outline:none;font-size:14.5px;
}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox .clear{color:var(--ink-3);display:flex;padding:4px}

.area{padding:0 16px}
.area-label{
  position:sticky;top:62px;z-index:10;background:var(--surface);
  display:flex;align-items:center;gap:10px;
  padding:18px 0 8px;
}
.area-label b{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--brand);
}
.area-label i{flex:1;height:1px;background:var(--line);font-style:normal}
.area-label em{
  font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:10.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}

.person-row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:11px 8px 11px 0;border-bottom:1px solid var(--line-soft);
  transition:background .15s ease;border-radius:10px;
}
.person-row:last-child{border-bottom:0}
.person-row:hover{background:var(--surface-2)}
.person-row:active{background:var(--brand-soft)}
.avatar{
  flex:none;width:46px;height:46px;border-radius:13px;overflow:hidden;
  background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;
  font-family:Archivo,sans-serif;font-weight:700;font-size:15px;letter-spacing:-.02em;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.person-meta{flex:1;min-width:0}
.person-meta .nm{
  font-family:Archivo,sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.person-meta .rl{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.person-row .chev{color:var(--ink-3);flex:none}

.empty{
  padding:34px 18px;text-align:center;color:var(--ink-2);font-size:14px;
}
.foot{
  margin-top:auto;padding:26px 16px calc(24px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid var(--line-soft);
}
.foot small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}

.hint{
  margin:14px 16px 0;padding:12px 14px;border-radius:var(--r-m);
  background:var(--amber-soft);color:var(--amber);
  font-size:13px;display:flex;gap:10px;align-items:flex-start;
  border:1px solid color-mix(in srgb, var(--amber) 25%, transparent);
}
.hint b{font-weight:600}
code{
  font-family:"IBM Plex Mono",monospace;font-size:.88em;
  background:color-mix(in srgb, currentColor 12%, transparent);
  padding:1px 5px;border-radius:5px;
}
.hint button{color:inherit;opacity:.7;flex:none;display:flex}

/* ---------------- card ---------------- */
.card{
  min-height:100vh;position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(158deg,#4A80E2 0%,#2A61CE 34%,#153A8E 68%,#0A2258 100%);
  color:#fff;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(16px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
  animation:cardIn .32s cubic-bezier(.2,.8,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.card::before{
  content:"";position:absolute;inset:0;z-index:-2;
  background:radial-gradient(80% 55% at 82% 8%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 62%);
}
.card .swoosh{position:absolute;inset:0;z-index:-1;opacity:.13;pointer-events:none}
.card-top{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.iconbtn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14);color:#fff;flex:none;
  transition:background .15s ease;
}
.iconbtn:hover{background:rgba(255,255,255,.26)}
.card-top .wordmark{margin:0 auto;transform:translateX(-19px)}
.card-top .wordmark span{font-size:22px}

.portrait{
  width:132px;height:164px;border-radius:8px;overflow:hidden;flex:none;
  background:rgba(255,255,255,.16);
  box-shadow:0 14px 34px rgba(5,20,55,.35);
  display:grid;place-items:center;margin-top:8px;
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .ini{font-family:Archivo,sans-serif;font-weight:700;font-size:38px;color:rgba(255,255,255,.85);letter-spacing:-.02em}

.card h2{
  margin:22px 0 0;font-family:Archivo,sans-serif;font-weight:700;
  font-size:clamp(28px,8vw,34px);line-height:1.08;letter-spacing:-.025em;
  text-align:center;text-wrap:balance;
}
.card .role{
  margin-top:12px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.78);text-align:center;
}
.card .mail{
  margin-top:16px;font-weight:600;font-size:14.5px;letter-spacing:.01em;
  color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3);
  padding-bottom:2px;word-break:break-all;text-align:center;
}
.qrwrap{
  margin-top:20px;background:#fff;border-radius:10px;padding:9px;
  box-shadow:0 10px 26px rgba(5,20,55,.25);line-height:0;
}
.qrwrap svg{display:block;width:112px;height:112px}
.qrcap{
  margin-top:9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.6);
}

.actions{width:100%;max-width:320px;margin-top:24px;display:flex;flex-direction:column;gap:11px}
.pill{
  display:flex;align-items:center;gap:12px;width:100%;
  background:#fff;color:#123; border-radius:999px;padding:7px 20px 7px 7px;
  font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.13em;text-transform:uppercase;text-decoration:none;
  box-shadow:0 6px 18px rgba(5,20,55,.2);
  transition:transform .14s ease, box-shadow .14s ease;
}
.pill:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(5,20,55,.28)}
.pill:active{transform:translateY(0)}
.pill .badge{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:#1E56C8;color:#fff;
}
.pill span{flex:1;text-align:center;transform:translateX(-17px);color:#0C2A66}

.socials{display:flex;gap:14px;margin-top:26px}
.social{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.16);color:#fff;text-decoration:none;
  transition:background .15s ease, transform .15s ease;
}
.social:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.savevcf{
  margin-top:20px;background:none;color:rgba(255,255,255,.7);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;
}
.savevcf:hover{color:#fff}

/* ---------------- editor ---------------- */
.ed{max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface);display:flex;flex-direction:column}
.ed-bar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  padding:calc(11px + env(safe-area-inset-top)) 14px 11px;
}
.ed-bar h2{
  margin:0;flex:1;font-family:Archivo,sans-serif;font-size:16px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.btn{
  border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;
  border:1px solid var(--line);color:var(--ink);background:var(--surface);
  transition:background .15s ease,border-color .15s ease;white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary[disabled]{opacity:.55;cursor:default;filter:none}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.sm{padding:6px 12px;font-size:12px}

.ed-body{padding:16px 14px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.note{
  padding:11px 13px;border-radius:var(--r-m);font-size:13px;
  background:var(--brand-soft);color:var(--ink);border:1px solid var(--line);
}
.note.warn{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 25%,transparent)}
.note.bad{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.note.ok{background:color-mix(in srgb,#1a8f5a 12%,transparent);color:#12764a;border-color:color-mix(in srgb,#1a8f5a 30%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note.ok{color:#63d3a0}}
:root[data-theme="dark"] .note.ok{color:#63d3a0}
.note .row{display:flex;gap:8px;margin-top:9px}

.block{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.block-head{
  display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;
  background:var(--surface-2);border-bottom:1px solid var(--line);
}
.block-head input{
  flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:7px;
  padding:6px 8px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--brand);
}
.block-head input:hover{border-color:var(--line)}
.block-head input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.mini{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-2);flex:none;transition:background .15s ease,color .15s ease;
}
.mini:hover{background:var(--line-soft);color:var(--ink)}
.mini.del:hover{color:var(--danger)}
.block-list{display:flex;flex-direction:column}
.ed-person{
  display:flex;align-items:center;gap:11px;padding:9px 10px 9px 14px;
  border-bottom:1px solid var(--line-soft);
}
.ed-person:last-child{border-bottom:0}
.ed-person .open{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left}
.ed-add{
  padding:11px 14px;color:var(--brand);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:8px;width:100%;border-top:1px solid var(--line-soft);
}
.ed-add:hover{background:var(--brand-soft)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}
.field input,.field textarea{
  border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
  padding:11px 13px;font-size:14.5px;width:100%;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.field .help{font-size:11.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
.section-title{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:6px 0 -4px;
}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .prev{
  width:66px;height:82px;border-radius:8px;overflow:hidden;flex:none;
  background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);
  font-family:Archivo,sans-serif;font-weight:700;font-size:20px;
}
.photo-pick .prev img{width:100%;height:100%;object-fit:cover;display:block}
.photo-pick .btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
input[type=file]{display:none}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;
  font-size:13px;font-weight:500;z-index:60;box-shadow:var(--shadow-lg);
  animation:toastIn .22s ease;max-width:90vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>

  var parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();

var QR_L = [

function gmul(a,b){ return (a===0||b===0) ? 0 : GF_EXP[GF_LOG[a]+GF_LOG[b]]; }
function rsGen(n){
  var poly = [1];
  for(var i=0;i<n;i++){
    var next = new Array(poly.length+1);
    for(var k=0;k<next.length;k++) next[k]=0;
    for(var j=0;j<poly.length;j++){
      next[j]   ^= poly[j];
      next[j+1] ^= gmul(poly[j], GF_EXP[i]);
    }
    poly = next;
  }
  return poly;

  var gen = rsGen(ecLen);

  buf.set(dataBytes);
  for(var i=0;i<dataBytes.length;i++){
    var f = buf[i];
    if(f === 0) continue;
    for(var j=0;j<gen.length;j++) buf[i+j] ^= gmul(gen[j], f);
  }
  return buf.slice(dataBytes.length);

function bitLen(n){ var c=0; while(n!==0){ c++; n >>>= 1; } return c; }

  switch(m){

    case 4: return (Math.floor(i/2) + Math.floor(j/3)) % 2 === 0;

  for(c=8;c<size-8;c++) if(m[6][c]===null) m[6][c] = (c % 2 === 0);

    else if(i < 8) m[i+1][8] = bit;
    else m[size-15+i][8] = bit;
  }
  for(i=0;i<15;i++){
    var bit2 = ((fmt >> i) & 1) === 1;
    if(i < 8) m[8][size-i-1] = bit2;
    else if(i < 9) m[8][15-i-1+1] = bit2;

/* ISO/IEC 18004 mask penalty rules N1-N4. The run-based N1 and the
   1:1:3:1:1-with-quiet-run N3 matter: the looser neighbour-count variant

function qrPenalty(m){

      else { if(run >= 5) lost += 3 + (run - 5); run = 1; }
    }
    if(run >= 5) lost += 3 + (run - 5);
  }

  /* N2 - 2x2 blocks of one colour */
  for(r=0;r<n-1;r++) for(c=0;c<n-1;c++){
    var v = !!m[r][c];
    if(v === !!m[r+1][c] && v === !!m[r][c+1] && v === !!m[r+1][c+1]) lost += 3;
  }

    var ln = lines[i];
    for(var s=0;s<=n-7;s++){
      var hit = true;
      for(var t=0;t<7;t++) if(ln[s+t] !== PAT[t]){ hit = false; break; }
      if(!hit) continue;
      var before = s >= 4 && !ln[s-1] && !ln[s-2] && !ln[s-3] && !ln[s-4];
      var after = s+10 < n && !ln[s+7] && !ln[s+8] && !ln[s+9] && !ln[s+10];

    }

  var dark = 0;
  for(r=0;r<n;r++) for(c=0;c<n;c++) if(m[r][c]) dark++;

function qrMatrix(text){
  var bytes = new TextEncoder().encode(text);
  var version = 0;
  for(var v=1; v<=20; v++){
    var capBytes = 0;
    QR_L[v-1][1].forEach(function(b){ capBytes += b[0]*b[1]; });
    var need = 4 + (v < 10 ? 8 : 16) + bytes.length * 8;
    if(need <= capBytes * 8){ version = v; break; }
  }
  if(!version) return null;
  var payload = qrCreateData(version, bytes);
  var best = null, bestScore = Infinity;
  for(var mask=0; mask<8; mask++){
    var m = qrBuild(version, mask, payload);

    if(m[r][c]) d += "M" + (c+quiet) + " " + (r+quiet) + "h1v1h-1z";
  }
  return '<svg viewBox="0 0 '+total+' '+total+'" shape-rendering="crispEdges" role="img" aria-label="Contact QR code">' +
         '<rect width="'+total+'" height="'+total+'" fill="#fff"/>' +
         '<path d="'+d+'" fill="'+color+'"/></svg>';
}

/* ============================================================
   4. vCard
   ============================================================ */
function vcard(p){
  var parts = String(p.name||"").trim().split(/\s+/).filter(Boolean);
  var last = parts.length > 1 ? parts[parts.length-1] : "";
  var first = parts.length > 1 ? parts.slice(0,-1).join(" ") : (parts[0]||"");
  var L = ["BEGIN:VCARD","VERSION:3.0"];
  L.push("N:" + esc0(last) + ";" + esc0(first) + ";;;");
  L.push("FN:" + esc0(p.name||""));
  var org = (data.brand && data.brand.company) || "";
  if(org) L.push("ORG:" + esc0(org));
  if(p.role) L.push("TITLE:" + esc0(p.role));
  if(p.email) L.push("EMAIL;TYPE=INTERNET,WORK:" + p.email.trim());
  if(p.phone) L.push("TEL;TYPE=WORK,VOICE:" + p.phone.trim());
  if(p.mobile) L.push("TEL;TYPE=CELL:" + p.mobile.trim());
  if(p.website) L.push("URL:" + tidyUrl(p.website));
  if(p.linkedin) L.push("URL;TYPE=LinkedIn:" + tidyUrl(p.linkedin));
  if(p.location && !/^https?:/i.test(p.location)) L.push("ADR;TYPE=WORK:;;" + esc0(p.location) + ";;;;");
  L.push("END:VCARD");
  return L.join("\r\n");
  function esc0(s){ return String(s).replace(/([,;\\])/g,"\\$1"); }
}

/* ============================================================
   5. views
   ============================================================ */
function route(){
  var h = (location.hash || "#/").replace(/^#/,"");
  var m;
  if((m = h.match(/^\/p\/(.+)$/))) return {view:"person", id:decodeURIComponent(m[1])};
  if((m = h.match(/^\/edit\/person\/(.+)$/))) return {view:"editPerson", id:decodeURIComponent(m[1])};
  if(h === "/edit") return {view:"edit"};
  return {view:"home"};
}

/* Each view binds its own delegated listeners, so the root node is swapped
   on every render - reusing it would stack handlers closing over stale data. */
function resetRoot(){
  var fresh = document.createElement("div");
  fresh.id = "root";
  root.parentNode.replaceChild(fresh, root);
  root = fresh;
}

function render(){
  var r = route();
  resetRoot();
  if(r.view === "person"){
    var hit = findPerson(r.id);
    if(!hit){ location.hash = "#/"; return; }
    root.innerHTML = viewPerson(hit.person);
    document.documentElement.scrollTop = 0;
    bindPerson(hit.person);
    return;
  }
  if(r.view === "edit" || r.view === "editPerson"){
    ensureDraft();
    root.innerHTML = (r.view === "edit") ? viewEditor() : viewPersonForm(r.id);
    document.documentElement.scrollTop = 0;
    (r.view === "edit") ? bindEditor() : bindPersonForm(r.id);
    return;
  }
  root.innerHTML = viewHome();
  bindHome();
}

/* ---------- home ---------- */
function viewHome(){
  var q = search.trim().toLowerCase();
  var body = "";
  var shown = 0;

  (data.areas||[]).forEach(function(area){
    var people = (area.people||[]).filter(function(p){
      if(!q) return true;
      return (p.name+" "+p.role+" "+p.email+" "+area.name).toLowerCase().indexOf(q) >= 0;
    });
    if(!people.length) return;
    shown += people.length;
    body += '<section class="area">' +
      '<div class="area-label"><b>'+esc(area.name)+'</b><i></i><em>'+people.length+'</em></div>';
    people.forEach(function(p){
      body += '<button class="person-row" data-go="'+attr(p.id)+'">' +
        avatarHtml(p, 46) +
        '<span class="person-meta">' +
          '<span class="nm">'+esc(p.name || "—")+'</span>' +
          '<span class="rl">'+esc(p.role || "")+'</span>' +
        '</span>' +
        '<span class="chev">'+icon("chev",18)+'</span>' +
      '</button>';
    });
    body += '</section>';
  });

  if(!shown){
    body = '<p class="empty">' + (q ? "No one matches &ldquo;"+esc(search)+"&rdquo;." : "No contacts yet.") + '</p>';
  }

  var hint = "";
  if(data.seed && !q){
    hint = '<div class="hint">' + icon("info",18) +
      '<span><b>Still a template.</b> Tap the <b>Cobus logo</b> above five times to open the editor, fill in your people, then publish.</span>' +
      '<button data-act="hide-hint" aria-label="Dismiss">'+icon("x",16)+'</button></div>';
  }

  return '<div class="shell">' +
    '<header class="banner">' + swoosh() +
      /* Five taps on the logo open the editor. The page runs in an iframe, so
         its #/edit route is unreachable from the address bar - a gesture is
         the only way in that clients never stumble into. */
      '<div class="banner-inner"><span class="brand-gate" data-act="brandtap">' + wordmark() + '</span>' +
        '<div><h1>'+esc((data.brand&&data.brand.company)||"Contacts")+'</h1>' +
        '<p>'+esc((data.brand&&data.brand.tagline)||"")+'</p></div>' +
      '</div>' +
    '</header>' +
    hint +
    '<div class="searchbar"><div class="searchbox">' + icon("search",17) +
      '<input id="q" type="search" placeholder="Search name, role or area" value="'+attr(search)+'" autocomplete="off">' +
      (search ? '<button class="clear" data-act="clear" aria-label="Clear">'+icon("x",16)+'</button>' : '') +
    '</div></div>' +
    body +
    /* No editor link here on purpose: clients receive this page and must not
       see a way in. The editor lives on the unlinked #/edit route. */
    '<footer class="foot">' +
      '<small>'+allPeople(data).length+' contacts</small>' +
      '<small>'+esc((data.brand&&data.brand.company)||"")+'</small>' +
    '</footer>' +
  '</div>';
}
/* Editor gate: five taps on the logo within ~1.2s of each other. */
var tapCount = 0, tapTimer = null;
function brandTap(){
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(function(){ tapCount = 0; }, 1200);
  if(tapCount === 4) toast("One more tap to open the editor.");
  if(tapCount >= 5){
    tapCount = 0; clearTimeout(tapTimer);
    location.hash = "#/edit";
  }
}

function avatarHtml(p, px){
  var inner = p.photo
    ? '<img src="'+attr(p.photo)+'" alt="">'
    : esc(initials(p.name));
  return '<span class="avatar" style="width:'+px+'px;height:'+px+'px">'+inner+'</span>';
}
function bindHome(){
  var q = document.getElementById("q");
  if(q){
    q.addEventListener("input", function(){
      search = q.value;
      var pos = q.selectionStart;
      render();
      var q2 = document.getElementById("q");
      if(q2){ q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
  root.addEventListener("click", function(e){
    var go = e.target.closest("[data-go]");
    if(go){ location.hash = "#/p/" + encodeURIComponent(go.getAttribute("data-go")); return; }
    var act = e.target.closest("[data-act]");
    if(!act) return;
    var a = act.getAttribute("data-act");
    if(a === "clear"){ search = ""; render(); }
    if(a === "hide-hint"){ data.seed = false; render(); }
    if(a === "brandtap") brandTap();
  });
}

/* ---------- person card ---------- */

  });

    (qr ? '<div class="qrwrap">'+qr+'</div><div class="qrcap">Scan to save contact</div>' : '') +
    '<div class="actions">' +
      (contactHref ? '<a class="pill" href="'+attr(contactHref)+'"><span class="badge">'+icon(contactIcon,17)+'</span><span>'+contactLabel+'</span></a>' : '') +
      (p.meeting ? '<a class="pill" href="'+attr(tidyUrl(p.meeting))+'" target="_blank" rel="noopener"><span class="badge">'+icon("cal",17)+'</span><span>Schedule a meeting</span></a>' : '') +
    '</div>' +

function bindPerson(p){
  root.addEventListener("click", function(e){
    var act = e.target.closest("[data-act]");
    if(!act) return;
    var a = act.getAttribute("data-act");
    if(a === "back"){
      if(history.length > 1) history.back(); else location.hash = "#/";
    }
    if(a === "vcf") saveVcf(p);
  });
}
/* On a normal host a Blob link saves the file; inside the artifact viewer
   only the downloads capability can, and the viewer may still decline. */
function downloadFile(filename, text, mime, okMsg){
  if(STATIC_HOST){
    try{
      var url = URL.createObjectURL(new Blob([text], {type: mime}));
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.parentNode.removeChild(a); }, 1000);
      toast(okMsg);
    }catch(e){ toast("Couldn't save the file."); }
    return;
  }
  useCap("downloads").then(function(d){
    if(!d){ toast("Downloads aren't available here — scan the QR code instead."); return; }
    return d.save({ filename: filename, data: text });
  }).then(function(r){
    if(r) toast(okMsg);
  })["catch"](function(){ toast("Couldn't save the file."); });
}

function saveVcf(p){
  var fname = (String(p.name||"contact").trim().replace(/[^\w\s-]/g,"").replace(/\s+/g,"-") || "contact") + ".vcf";
  downloadFile(fname, vcard(p), "text/vcard;charset=utf-8", "Contact saved.");
}

function ensureDraft(){
  if(draft) return;
  var stored = null;
  try{
    var raw = localStorage.getItem(DRAFT_KEY);
    if(raw) stored = JSON.parse(raw);
  }catch(e){ stored = null; }
  if(stored && JSON.stringify(stored) !== JSON.stringify(data)){
    draft = stored; draftDirty = true;
  }else{
    draft = clone(data); draftDirty = false;
  }
}
function touchDraft(){
  draftDirty = true;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); }catch(e){}
}
function dropDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  draft = clone(data); draftDirty = false;
}
function findDraftPerson(id){
  for(var i=0;i<draft.areas.length;i++){

      '<div class="block" style="padding:14px;display:flex;flex-direction:column;gap:12px">' +
        '<div class="grid2">' +
          '<div class="field"><label>Brand name</label><input data-brand="name" value="'+attr(draft.brand.name||"")+'"></div>' +
          '<div class="field"><label>Company</label><input data-brand="company" value="'+attr(draft.brand.company||"")+'"></div>' +
        '</div>' +
        '<div class="field"><label>Home page line</label><input data-brand="tagline" value="'+attr(draft.brand.tagline||"")+'"></div>' +
        '<div class="field"><label>Logo</label><div class="photo-pick">' +
          '<span class="prev" style="width:88px;height:52px;background:#123a86;color:#fff">' +
            (draft.brand.logo ? '<img src="'+attr(draft.brand.logo)+'" alt="" style="object-fit:contain">' : 'Cobus') +
          '</span>' +
          '<span class="btns">' +
            '<button class="btn sm" data-act="pick-logo">Upload image</button>' +
            (draft.brand.logo ? '<button class="btn sm danger" data-act="clear-logo">Remove</button>' : '') +
          '</span>' +
        '</div><span class="help">A transparent PNG works best.</span></div>' +
      '</div>' +
      '<p class="section-title">Areas and people</p>' +
      blocks +
      '<button class="btn" data-act="aadd">'+icon("plus",15)+' Add area</button>' +
      '<p class="section-title">Access</p>' +
      '<div class="note">Clients open the link and see the directory only — nothing visible leads here. ' +
        'To get back to this screen, <b>tap the Cobus logo on the home page five times</b>.' +
        (STATIC_HOST
          ? ' Anyone who can push to the repository can change what goes live.'
          : ' Tell that to anyone you want as an editor — but they can only publish if the owner granted them ' +
            '<b>edit</b> access to this artifact; everyone else gets a read-only copy of this screen.') +
      '</div>' +
      '<p class="section-title">Backup</p>' +
      '<div class="note">' +
        '<div class="row"><button class="btn sm" data-act="copy-json">Copy data (JSON)</button>' +
        (STATIC_HOST ? '' : '<button class="btn sm" data-act="save-page">Save as index.html</button>') +
        '<button class="btn sm" data-act="paste-json">' + (showImport ? "Close" : "Import JSON") + '</button></div>' +
        (showImport
          ? '<div class="field" style="margin-top:12px"><label>Paste JSON</label>' +
            '<textarea id="import-json" rows="6" placeholder="{ &quot;areas&quot;: [ ... ] }"></textarea>' +
            '<div class="row"><button class="btn sm primary" data-act="do-import">Replace data</button></div></div>'
          : '') +
      '</div>' +
    '</div>' +
    '<input type="file" id="logo-file" accept="image/*">' +
  '</div>';
}

function bindEditor(){
  root.addEventListener("input", function(e){
    var t = e.target;
    if(t.hasAttribute("data-brand")){ draft.brand[t.getAttribute("data-brand")] = t.value; touchDraft(); }
    if(t.hasAttribute("data-area-name")){ draft.areas[+t.getAttribute("data-area-name")].name = t.value; touchDraft(); }
  });
  root.addEventListener("click", function(e){
    var el, a;
    if((el = e.target.closest("[data-open]"))){ location.hash = "#/edit/person/" + encodeURIComponent(el.getAttribute("data-open")); return; }
    if((el = e.target.closest("[data-padd]"))){
      var ai = +el.getAttribute("data-padd");
      var np = newPerson();
      draft.areas[ai].people.push(np); touchDraft();
      location.hash = "#/edit/person/" + encodeURIComponent(np.id); return;
    }
    if((el = e.target.closest("[data-pdel]"))){
      var pid = el.getAttribute("data-pdel");
      if(pendingDelete !== pid){ pendingDelete = pid; render(); return; }
      var hit = findDraftPerson(pid);
      if(hit) hit.area.people.splice(hit.pi, 1);
      pendingDelete = null; touchDraft(); render(); return;
    }
    if((el = e.target.closest("[data-adel]"))){
      var aid = el.getAttribute("data-adel");
      if(pendingDelete !== aid){ pendingDelete = aid; render(); return; }
      draft.areas = draft.areas.filter(function(x){ return x.id !== aid; });
      pendingDelete = null; touchDraft(); render(); return;
    }
    pendingDelete = null;
    if((el = e.target.closest("[data-pmove]"))){
      var m = el.getAttribute("data-pmove").split(":");
      move(draft.areas[+m[0]].people, +m[1], +m[2]); touchDraft(); render(); return;
    }
    if((el = e.target.closest("[data-amove]"))){
      var am = el.getAttribute("data-amove").split(":");
      move(draft.areas, +am[0], +am[1]); touchDraft(); render(); return;
    }
    el = e.target.closest("[data-act]"); if(!el) return;
    a = el.getAttribute("data-act");
    if(a === "close"){ location.hash = "#/"; }
    if(a === "aadd"){ draft.areas.push({id:uid("a"), name:"New area", people:[]}); touchDraft(); render(); }
    if(a === "discard"){ confirmDiscard = true; render(); }
    if(a === "discard-yes"){ confirmDiscard = false; dropDraft(); render(); }
    if(a === "discard-no"){ confirmDiscard = false; render(); }
    if(a === "publish") publish(el);
    if(a === "save-page"){
      draft.seed = false;
      downloadFile("index.html", buildDoc(draft), "text/html;charset=utf-8",
                   "Saved. Replace index.html in your repository with this file.");
      touchDraft();
    }
    if(a === "pick-logo") document.getElementById("logo-file").click();
    if(a === "clear-logo"){ draft.brand.logo = null; touchDraft(); render(); }
    if(a === "copy-json") copyJson();
    if(a === "paste-json"){ showImport = !showImport; render(); }
    if(a === "do-import") doImport();
  });
  var lf = document.getElementById("logo-file");
  if(lf) lf.addEventListener("change", function(){
    var f = lf.files && lf.files[0]; if(!f) return;
    resizeImage(f, 420, 200, true).then(function(url){
      draft.brand.logo = url; touchDraft(); render();
    })["catch"](function(){ toast("Couldn't read that image."); });
  });
}
function move(arr, i, dir){
  var j = i + dir;
  if(j < 0 || j >= arr.length) return;
  var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}
function newPerson(){
  return {id:uid("p"), name:"", role:"", email:"", phone:"", mobile:"", website:"",
          linkedin:"", instagram:"", location:"", meeting:"", photo:null};
}

/* ---------- person form ---------- */
var FIELDS = [
  ["name","Full name","text","e.g. Ana Ribeiro"],
  ["role","Role","text","e.g. Project Manager"],
  ["email","Email","email","name@cobus.com"],

  var grid = '<div class="grid2">'+fields[0]+fields[1]+'</div>' +

  return '<div class="ed">' +
    '<div class="ed-bar">' +
      '<button class="btn ghost" data-act="back">'+icon("back",16)+'</button>' +
      '<h2>'+esc(p.name || "New person")+'</h2>' +
      '<button class="btn primary" data-act="done">Done</button>' +
    '</div>' +
    '<div class="ed-body">' +
      '<div class="field"><label>Photo</label><div class="photo-pick">' +
        '<span class="prev">' + (p.photo ? '<img src="'+attr(p.photo)+'" alt="">' : esc(initials(p.name))) + '</span>' +
        '<span class="btns">' +
          '<button class="btn sm" data-act="pick-photo">Choose photo</button>' +
          (p.photo ? '<button class="btn sm danger" data-act="clear-photo">Remove</button>' : '') +
        '</span>' +
      '</div><span class="help">Portrait orientation (3:4). Resized automatically.</span></div>' +
      grid +
      '<div class="note">Only the fields you fill in show up on the card. The Instagram, LinkedIn, website and location icons appear only when they have a link.</div>' +
      (pendingDelete === p.id
        ? '<div class="note bad">Delete <b>'+esc(p.name||"this person")+'</b> from this area?' +
          '<div class="row"><button class="btn sm danger" data-act="delete-yes">Delete</button>' +
          '<button class="btn sm" data-act="delete-no">Cancel</button></div></div>'
        : '<button class="btn danger" data-act="delete">'+icon("trash",15)+' Delete this person</button>') +
    '</div>' +
    '<input type="file" id="photo-file" accept="image/*">' +
  '</div>';
}
function bindPersonForm(id){
  var hit = findDraftPerson(id);
  if(!hit) return;
  var p = hit.person;
  root.addEventListener("input", function(e){
    var t = e.target;
    if(!t.hasAttribute("data-f")) return;
    p[t.getAttribute("data-f")] = t.value;
    touchDraft();
    if(t.getAttribute("data-f") === "name"){
      var h = root.querySelector(".ed-bar h2");
      if(h) h.textContent = p.name || "New person";
    }
  });
  root.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]"); if(!el) return;
    var a = el.getAttribute("data-act");
    if(a === "back" || a === "done"){ pendingDelete = null; location.hash = "#/edit"; }
    if(a === "pick-photo"){ document.getElementById("photo-file").click(); }
    if(a === "clear-photo"){ p.photo = null; touchDraft(); render(); }
    if(a === "delete"){ pendingDelete = p.id; render(); }
    if(a === "delete-no"){ pendingDelete = null; render(); }
    if(a === "delete-yes"){
      var fresh = findDraftPerson(p.id);
      if(fresh) fresh.area.people.splice(fresh.pi, 1);
      pendingDelete = null; touchDraft(); location.hash = "#/edit";
    }
  });
  var pf = document.getElementById("photo-file");
  if(pf) pf.addEventListener("change", function(){
    var f = pf.files && pf.files[0]; if(!f) return;
    resizeImage(f, 480, 640, false).then(function(url){
      p.photo = url; touchDraft(); render();
    })["catch"](function(){ toast("Couldn't read that image."); });
  });
}

/* ---------- image handling ---------- */
function resizeImage(file, maxW, maxH, keepAlpha){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        var scale = Math.min(maxW / img.width, maxH / img.height, 1);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        var ctx = cv.getContext("2d");
        if(!keepAlpha){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img, 0, 0, w, h);
        try{
          resolve(keepAlpha ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.84));
        }catch(err){ reject(err); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- backup ---------- */
function copyText(txt, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg); },
      function(){ toast("Couldn't copy to the clipboard."); });
  }else{ toast("Couldn't copy to the clipboard."); }
}
function copyJson(){ copyText(JSON.stringify(draft, null, 2), "JSON copied."); }
function doImport(){
  var ta = document.getElementById("import-json");
  var txt = ta ? ta.value.trim() : "";
  if(!txt){ toast("Paste the JSON first."); return; }
  var obj;
  try{ obj = JSON.parse(txt); }
  catch(e){ toast("That isn't valid JSON."); return; }
  if(!obj || !Array.isArray(obj.areas)){ toast("The JSON needs an “areas” list."); return; }
  if(!obj.brand) obj.brand = {name:"Cobus", company:"", tagline:"", logo:null};
  obj.areas.forEach(function(a){
    if(!a.id) a.id = uid("a");
    if(!Array.isArray(a.people)) a.people = [];
    a.people.forEach(function(p){ if(!p.id) p.id = uid("p"); });
  });
  draft = obj; showImport = false; touchDraft(); render();
  toast("Data imported — publish to make it live.");
}

/* ============================================================
   7. publish (page saves a new version of itself)
   ============================================================ */
function useCap(name){
  try{
    if(typeof claude !== "undefined" && claude && typeof claude.use === "function"){
      return Promise.resolve(claude.use(name)).catch(function(){ return null; });
    }
  }catch(e){}
  return Promise.resolve(null);
}
function buildDoc(d){
  var css = document.getElementById("app-style").textContent;
  var js  = document.getElementById("app-script").textContent;
  var json = JSON.stringify(d).replace(/</g, "\\u003c");
  var S = "scr" + "ipt";
  return '<!doctype html>\n<html lang="en">\n<head>\n' +
    '<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    /* Staff contact details: reachable by link, but kept out of search results. */
    '<meta name="robots" content="noindex, nofollow">\n' +
    '<title>' + esc(PAGE_TITLE) + '</title>\n' +
    FONT_LINK + '\n' +
    '<style id="app-style">' + css + '</style>\n' +
    '</head>\n<body>\n' +
    '<div id="root"></div>\n' +
    '<' + S + ' id="app-data" type="application/json">' + json + '</' + S + '>\n' +
    '<' + S + ' id="app-script">' + js + '</' + S + '>\n' +
    '</body>\n</html>';
}
function publish(btn){
  btn.disabled = true;
  var label = btn.textContent;
  btn.textContent = "Publishing…";
  draft.seed = false;
  useCap("artifact").then(function(api){
    if(!api) throw {code:"not_granted"};
    return api.publish(buildDoc(draft));
  }).then(function(){
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    toast("Published. Everyone who opens the link now sees this version.");
    btn.disabled = false; btn.textContent = label;
  })["catch"](function(err){
    btn.disabled = false; btn.textContent = label;
    var code = (err && err.code) || "";
    var msg;
    if(code === "conflict"){
      msg = "Someone else published first — this page is reloading to their version.";
    }else if(code === "not_writer" || code === "not_granted" ||
             code === "consent_required" || code === "not_declared"){
      /* Documented read-only signal: hide write affordances from here on. */
      readOnly = true;
      try{ sessionStorage.setItem("cobus-cards-readonly","1"); }catch(e){}
      render();
      return;
    }else if(code === "too_large"){
      msg = "The page is too big to publish. Remove or re-crop a few photos and try again.";
    }else if(code === "rate_limited"){
      msg = "Publishing too often. Wait a moment, then press Publish again.";
    }else{
      msg = "Couldn't publish. Your changes are still saved on this device.";
    }
    showEditorNote(msg, code === "conflict" ? "warn" : "bad");
  });
}
function showEditorNote(msg, kind){
  var body = root.querySelector(".ed-body");
  if(!body){ toast(msg); return; }
  var old = body.querySelector(".note.publish-note");
  if(old) old.remove();
  var n = document.createElement("div");
  n.className = "note publish-note " + (kind || "bad");
  n.textContent = msg;
  body.insertBefore(n, body.firstChild);
  n.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ============================================================
   8. boot
   ============================================================ */
window.addEventListener("hashchange", function(){
  pendingDelete = null; confirmDiscard = false; showImport = false;
  render();
});
document.title = PAGE_TITLE;
render();
})();
